name: Go Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contracts:check
      - run: pnpm go:test
      - run: pnpm go:vet
      - run: pnpm go:staticcheck
      - run: pnpm go:stage-web
      - run: pnpm playwright install --with-deps chromium
      - run: pnpm playwright test --project=go-runtime

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm go:stage-web
      - run: pnpm go:release
        env:
          SYNAPLOOM_VERSION: ${{ github.ref_name }}
          SYNAPLOOM_COMMIT: ${{ github.sha }}
          SYNAPLOOM_SCHEMA_VERSION: '1.1.0'
      - run: pnpm go:verify-release
      - run: pnpm go:write-release-evidence
      - run: pnpm go:archive-source
      - uses: actions/upload-artifact@v4
        with:
          name: synaploom-native-${{ github.sha }}
          path: |
            artifacts/native/**
            artifacts/source/**
            docs/releases/go-core-migration-verification.md
          if-no-files-found: error
