name: Go SQLite matrix

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/storage/**'
      - '.github/workflows/go-sqlite-matrix.yml'
  push:
    branches: [main]

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - run: go test ./internal/storage -run SQLiteDriver
      - run: go test ./tests/go-integration -run HierarchicalProgression -count=1

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin/amd64
          - darwin/arm64
          - linux/amd64
          - linux/arm64
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - shell: bash
        run: |
          target='${{ matrix.target }}'
          GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
            go test -c ./internal/storage -o "/tmp/storage-${target//\//-}.test"
